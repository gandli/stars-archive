name: 📋 Sync GitHub Stars

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 02:00 UTC = 北京时间 10:00
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sync-stars
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache desc-cn.json
        uses: actions/cache@v4
        with:
          path: data/desc-cn.json
          key: translator-${{ hashFiles('data/stars-enriched.json') }}
          restore-keys: |
            translator-

      - name: Fetch Stars
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/sync.py

      - name: Enrich Data
        run: |
          python scripts/enrich.py

      - name: Translate Descriptions (concurrent + retry)
        timeout-minutes: 15
        run: |
          python scripts/translator.py --max-workers 12 --rate-limit 0.3

      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Detect changes
        id: detect
        run: |
          if [ -f data/stars-previous.json ]; then
            python scripts/detect_changes.py
          else
            cp data/stars.json data/stars-previous.json
          fi

      - name: Show sync summary
        run: |
          echo "## Sync Summary"
          echo "- Total stars: $(jq '. | length' data/stars-enriched.json)"
          echo "- Last synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -f data/desc-cn.json ]; then
            echo "- Translations: $(jq '. | length' data/desc-cn.json)"
          fi

      - name: Update vectors & export
        run: |
          if [ -f scripts/generate_vectors.py ]; then
            python scripts/generate_vectors.py || echo "Vector generation skipped"
          fi
          if [ -f scripts/export_for_web.py ]; then
            python scripts/export_for_web.py || echo "Export skipped"
          fi

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            📋 Sync stars $(date +%Y-%m-%d)
          file_pattern: |
            data/*.json
            data/*.bin
            README.md
            index.html
          skip_dirty_check: false
          commit_options: '--no-verify'
